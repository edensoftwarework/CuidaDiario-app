<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - CuidaDiario</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .login-box {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 440px;
            width: 100%;
        }
        .login-header { text-align: center; margin-bottom: 28px; }
        .login-header h1 { color: #667eea; margin-bottom: 5px; font-size: 2rem; }
        .login-header p  { color: #666; font-size: 0.9rem; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
        .form-group input {
            width: 100%; padding: 12px;
            border: 2px solid #e0e0e0; border-radius: 8px;
            font-size: 1rem; transition: border-color 0.3s;
            box-sizing: border-box;
        }
        .form-group input:focus { outline: none; border-color: #667eea; }
        .btn-submit {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 8px;
            font-size: 1rem; font-weight: 600; cursor: pointer; transition: transform 0.2s;
        }
        .btn-submit:hover  { transform: translateY(-2px); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .error-message {
            background: #fee; color: #c33; padding: 12px;
            border-radius: 8px; margin-bottom: 20px; display: none;
        }
        .success-message {
            background: #efe; color: #3c3; padding: 12px;
            border-radius: 8px; margin-bottom: 20px; display: none;
        }
        .hint { color: #888; font-size: 0.82rem; margin-top: 4px; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #667eea; text-decoration: none; font-size: 0.9rem; }
        .expired-box { text-align: center; padding: 20px 0; }
        .expired-box p { color: #555; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>🔑 CuidaDiario</h1>
                <p>Restablecer contraseña</p>
            </div>

            <div id="errorMessage"   class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <!-- Formulario de nueva contraseña -->
            <div id="resetForm">
                <form onsubmit="handleReset(event)">
                    <div class="form-group">
                        <label for="newPassword">Nueva contraseña</label>
                        <input type="password" id="newPassword" required minlength="6"
                               placeholder="Mínimo 6 caracteres">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirmar contraseña</label>
                        <input type="password" id="confirmPassword" required minlength="6"
                               placeholder="Repetí la contraseña">
                        <span class="hint">Ambas contraseñas deben coincidir.</span>
                    </div>
                    <button type="submit" class="btn-submit" id="btnReset">Guardar nueva contraseña</button>
                </form>
            </div>

            <!-- Estado: token expirado / inválido -->
            <div id="expiredBox" class="expired-box" style="display:none;">
                <p>⚠️ Este enlace de recuperación es inválido o ya expiró.</p>
                <a href="login.html" class="btn-submit" style="display:inline-block;text-decoration:none;padding:12px 24px;">
                    Solicitar nuevo enlace
                </a>
            </div>

            <a href="login.html" class="back-link">← Volver al inicio de sesión</a>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        // Leer el token de la URL
        const urlParams  = new URLSearchParams(window.location.search);
        const resetToken = urlParams.get('token');

        if (!resetToken) {
            document.getElementById('resetForm').style.display = 'none';
            document.getElementById('expiredBox').style.display = 'block';
        }

        function showError(msg) {
            const el = document.getElementById('errorMessage');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('successMessage').style.display = 'none';
        }

        function showSuccess(msg) {
            const el = document.getElementById('successMessage');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';
        }

        async function handleReset(event) {
            event.preventDefault();
            const password  = document.getElementById('newPassword').value;
            const confirm   = document.getElementById('confirmPassword').value;
            const btn       = document.getElementById('btnReset');

            if (password !== confirm) {
                showError('Las contraseñas no coinciden.');
                return;
            }
            if (password.length < 6) {
                showError('La contraseña debe tener al menos 6 caracteres.');
                return;
            }

            btn.disabled    = true;
            btn.textContent = 'Guardando...';

            try {
                const response = await fetch(`${API.BASE_URL}/api/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: resetToken, password })
                });
                const data = await response.json();

                if (!response.ok) {
                    if (response.status === 400 && data.error && data.error.includes('expiró')) {
                        document.getElementById('resetForm').style.display = 'none';
                        document.getElementById('expiredBox').style.display = 'block';
                    } else {
                        showError(data.error || 'Error al restablecer la contraseña.');
                    }
                    btn.disabled    = false;
                    btn.textContent = 'Guardar nueva contraseña';
                    return;
                }

                // Éxito
                document.getElementById('resetForm').style.display = 'none';
                showSuccess('✅ ' + data.message);
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2500);

            } catch (err) {
                showError('Error de conexión. Intentá de nuevo.');
                btn.disabled    = false;
                btn.textContent = 'Guardar nueva contraseña';
            }
        }
    </script>
</body>
</html>
