<!DOCTYPE html>
<html lang="es">
<head>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 24px;
        }
        .card {
            background: #fff;
            border-radius: 24px;

            width: 100%;
            text-align: center;
            box-shadow: 0 24px 80px rgba(0,0,0,0.18);

        .emoji { font-size: 4.5rem; margin-bottom: 4px; display: block; }
        .code  { font-size: 5rem; font-weight: 800; color: #667eea; line-height: 1; }
        h1 { font-size: 1.4rem; font-weight: 700; color: #222; margin: 14px 0 10px; }
        p  { color: #666; font-size: 0.95rem; line-height: 1.65; margin-bottom: 32px; }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            padding: 14px 36px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            transition: opacity 0.2s, transform 0.15s;
        }
        .btn:hover { opacity: 0.88; transform: translateY(-2px); }
        .footer {
            margin-top: 28px;
            font-size: 0.8rem;
            color: #bbb;
        }
        .footer strong { color: #999; }
